<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methang</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F3F4F6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #E5E7EB;
            border-top: 4px solid #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 16px;
            color: #6B7280;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <div class="loader-text">Loading...</div>
    </div>

    <script>
        // Wait for Supabase to load
        window.addEventListener('load', async function() {
            try {
                // Check if Supabase loaded
                if (!window.supabase) {
                    console.error('Supabase not loaded');
                    window.location.href = 'login.html';
                    return;
                }

                // Initialize Supabase
                const SUPABASE_URL = 'https://kzamdgraevgyfxouasbw.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YW1kZ3JhZXZneWZ4b3Vhc2J3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MDU4NTAsImV4cCI6MjA4ODI4MTg1MH0.u13iWMfs2qKrrx0eR6ka4PwwwtFP7GgYw-MmzBysT6M';
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                // Check auth and redirect
                const { data: { session }, error } = await supabase.auth.getSession();
                
                if (error) {
                    console.error('Auth error:', error);
                    window.location.href = 'login.html';
                    return;
                }
                
                if (session) {
                    // User is logged in → go to home
                    window.location.href = 'home.html';
                } else {
                    // User is NOT logged in → go to login
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('Error:', error);
                // On any error, default to login page
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
