<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methang</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F3F4F6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #E5E7EB;
            border-top: 4px solid #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 16px;
            color: #6B7280;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <div class="loader-text">Loading...</div>
    </div>

    <script>
        // Fallback timeout - if nothing happens in 3 seconds, go to login
        setTimeout(function() {
            window.location.replace('login.html');
        }, 3000);

        // Simple and fast redirect logic
        (async function() {
            try {
                // Wait a moment for Supabase to load
                await new Promise(resolve => setTimeout(resolve, 200));
                
                // Check if Supabase loaded
                if (!window.supabase || !window.supabase.createClient) {
                    console.warn('Supabase not loaded');
                    window.location.replace('login.html');
                    return;
                }

                // Initialize Supabase
                const supabase = window.supabase.createClient(
                    'https://kzamdgraevgyfxouasbw.supabase.co',
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YW1kZ3JhZXZneWZ4b3Vhc2J3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MDU4NTAsImV4cCI6MjA4ODI4MTg1MH0.u13iWMfs2qKrrx0eR6ka4PwwwtFP7GgYw-MmzBysT6M'
                );

                // Quick session check
                const { data, error } = await supabase.auth.getSession();
                
                if (error || !data || !data.session) {
                    // No session or error - go to login
                    window.location.replace('login.html');
                } else {
                    // Has session - go to home
                    window.location.replace('home.html');
                }
            } catch (err) {
                // Any error - default to login
                console.error('Index error:', err);
                window.location.replace('login.html');
            }
        })();
    </script>
</body>
</html>
