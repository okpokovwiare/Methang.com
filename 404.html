<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
  // GitHub Pages SPA redirect — handles /shop/my-store → /shop/?s=my-store
  var path = window.location.pathname;
  var match = path.match(/^\/shop\/([^/]+)\/?$/);
  if (match) {
    window.location.replace('/shop/?s=' + encodeURIComponent(match[1]));
  } else {
    // Not a catalog URL — redirect to home
    window.location.replace('/');
  }
</script>
</head>
<body></body>
</html>
