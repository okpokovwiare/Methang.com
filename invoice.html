<!DOCTYPE html>
<html lang="en">
<head>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice – Methang</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #F3F4F6; min-height: 100vh; }

        /* ── Loading / Error states ── */
        .state-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 32px; text-align: center; gap: 12px; }
        .state-spinner { width: 40px; height: 40px; border: 3px solid #E5E7EB; border-top-color: #0075FF; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .state-icon { font-size: 48px; }
        .state-title { font-size: 18px; font-weight: 700; color: #1A1A1A; }
        .state-sub { font-size: 14px; color: #6B7280; }

        /* ── Page wrapper ── */
        .page { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }

        /* ── Top bar ── */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .top-logo { font-size: 15px; font-weight: 800; color: #0075FF; letter-spacing: -0.5px; }
        .print-btn { background: #0075FF; color: white; border: none; border-radius: 10px; padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px; }
        .print-btn:active { opacity: 0.85; }

        /* ── Invoice card ── */
        .inv-card { background: white; border-radius: 16px; padding: 28px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }

        /* Header */
        .inv-big-label { font-size: 28px; font-weight: 800; color: #1A1A1A; letter-spacing: -1px; line-height: 1; display: block; margin-bottom: 4px; }
        .inv-biz-name-main { font-size: 16px; font-weight: 700; color: #1A1A1A; margin-bottom: 24px; }

        /* Info card */
        .inv-info-card { border: 1.5px solid #E5E7EB; border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; margin-bottom: 24px; gap: 12px; }
        .inv-bill-col { flex: 1; min-width: 0; }
        .inv-meta-col { text-align: right; flex-shrink: 0; }
        .inv-card-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #9CA3AF; margin-bottom: 4px; }
        .inv-card-name { font-size: 14px; font-weight: 700; color: #1A1A1A; }
        .inv-card-sub { font-size: 12px; color: #6B7280; margin-top: 2px; line-height: 1.5; }
        .inv-meta-item { margin-bottom: 8px; }
        .inv-meta-item:last-child { margin-bottom: 0; }
        .inv-meta-val { font-size: 12px; font-weight: 600; color: #1A1A1A; }

        /* Items table */
        .inv-table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
        .inv-table thead tr { background: #F9FAFB; }
        .inv-table th { font-size: 10px; font-weight: 700; color: #6B7280; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px; border-top: 1px solid #E5E7EB; border-bottom: 1px solid #E5E7EB; text-align: left; }
        .inv-table th:nth-child(2) { text-align: right; }
        .inv-table th:nth-child(3) { text-align: center; }
        .inv-table th:last-child { text-align: right; }
        .inv-table td { font-size: 13px; color: #1A1A1A; padding: 10px 8px; border-bottom: 1px solid #F3F4F6; vertical-align: top; }
        .inv-table td.item-name { font-weight: 600; }
        .inv-table td:nth-child(2) { text-align: right; color: #6B7280; }
        .inv-table td:nth-child(3) { text-align: center; color: #6B7280; }
        .inv-table td:last-child { text-align: right; font-weight: 700; }

        /* Totals */
        .inv-totals { padding: 10px 0 0; }
        .inv-total-row { display: flex; justify-content: flex-end; align-items: center; padding: 3px 0; font-size: 13px; }
        .inv-total-row .lbl { color: #6B7280; width: 120px; text-align: right; margin-right: 20px; }
        .inv-total-row .val { font-weight: 600; color: #1A1A1A; min-width: 80px; text-align: right; }

        /* Amount due */
        .inv-amount-due { display: flex; justify-content: flex-end; align-items: center; padding: 12px 0; border-top: 1.5px solid #E5E7EB; margin-top: 8px; font-size: 15px; font-weight: 700; }
        .inv-amount-due .lbl { width: 120px; text-align: right; margin-right: 20px; color: #1A1A1A; }
        .inv-amount-due .val { min-width: 80px; text-align: right; color: #1A1A1A; }

        /* Balance box */
        .inv-balance-box { background: #FEF3C7; border-radius: 10px; padding: 12px 14px; margin-top: 16px; }
        .inv-balance-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
        .inv-balance-row:last-child { margin-bottom: 0; }

        /* Payment method */
        .inv-payment-row { display: flex; justify-content: flex-end; align-items: center; padding: 3px 0; font-size: 13px; margin-top: 12px; }
        .inv-payment-row .lbl { color: #6B7280; width: 120px; text-align: right; margin-right: 20px; }
        .inv-payment-row .val { font-weight: 600; color: #1A1A1A; min-width: 80px; text-align: right; }

        /* Footer */
        .inv-footer { text-align: center; padding-top: 20px; margin-top: 24px; border-top: 1px dashed #E5E7EB; }
        .inv-footer-thanks { font-size: 13px; font-weight: 700; color: #1A1A1A; margin-bottom: 4px; }
        .inv-footer-powered { font-size: 11px; color: #9CA3AF; }

        /* ── Action buttons ── */
        .inv-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .inv-action-btn { flex: 1; min-width: 100px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: white; border: 1.5px solid #E5E7EB; border-radius: 14px; padding: 14px 10px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; color: #374151; transition: background 0.15s; }
        .inv-action-btn:active { background: #F9FAFB; }
        .inv-action-btn .icon { font-size: 22px; }
        .inv-action-btn.primary { background: #0075FF; color: white; border-color: #0075FF; }
        .inv-action-btn.primary:active { background: #005FCC; }

        /* Toast */
        .inv-toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1A1A1A; color: white; padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; z-index: 999; }
        .inv-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Print styles */
        @media print {
            body { background: white; }
            .top-bar { display: none; }
            .inv-actions { display: none !important; }
            .page { padding: 0; }
            .inv-card { box-shadow: none; border-radius: 0; padding: 0; }
        }

        @media (max-width: 480px) {
            .inv-card { padding: 20px 16px; }
        }
    </style>
</head>
<body>

<div id="loadingScreen" class="state-screen">
    <div class="state-spinner"></div>
    <div class="state-title">Loading invoice…</div>
</div>

<div id="errorScreen" class="state-screen" style="display:none;">
    <div class="state-icon">📄</div>
    <div class="state-title">Invoice not found</div>
    <div class="state-sub">This invoice link may be invalid or expired.</div>
</div>

<div id="invoicePage" style="display:none;">
    <div class="page">
        <div class="top-bar">
            <div class="top-logo">Methang</div>
            <button class="print-btn" onclick="window.print()">🖨️ Print / Save PDF</button>
        </div>
        <div class="inv-card" id="invoiceContent"></div>
        <div class="inv-actions" id="invActions" style="display:none;">
            <button class="inv-action-btn primary" onclick="copyInvoiceLink()">
                <span class="icon">🔗</span>Copy Link
            </button>
            <button class="inv-action-btn" onclick="shareWhatsApp()">
                <span class="icon">💬</span>WhatsApp
            </button>
            <button class="inv-action-btn" onclick="shareNative()">
                <span class="icon">↗️</span>Share
            </button>
            <button class="inv-action-btn" onclick="window.print()">
                <span class="icon">🖨️</span>Print / PDF
            </button>
        </div>
    </div>
</div>
<div class="inv-toast" id="invToast"></div>

<script>
    const SUPABASE_URL      = 'https://ufcpvbabgtftyfumzpnp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmY3B2YmFiZ3RmdHlmdW16cG5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODEwMzcsImV4cCI6MjA5MDQ1NzAzN30.TzFJxnc8_ykXegNo2oMlN0xHXPkwHQcYNMAFMJorq5U';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function fmtMethod(m) {
        const map = { cash: 'Cash', transfer: 'Bank Transfer', card: 'Card', pos: 'POS', credit: 'Credit' };
        return map[m] || m || '—';
    }

    function fmt(n) {
        return '₦' + Number(n || 0).toLocaleString();
    }

    async function loadInvoice() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const id = params.get('id');

        if (!token && !id) { showError(); return; }

        try {
            let sale, saleErr;
            if (token) {
                // Public share link — load by share_token (no auth required)
                ({ data: sale, error: saleErr } = await db
                    .from('sales')
                    .select('*')
                    .eq('share_token', token)
                    .single());
            } else {
                // Owner view — load by sale UUID
                ({ data: sale, error: saleErr } = await db
                    .from('sales')
                    .select('*')
                    .eq('id', id)
                    .single());
            }

            if (saleErr || !sale) { showError(); return; }

            // Fetch business profile
            let biz = {};
            if (sale.user_id) {
                const { data: profile } = await db
                    .from('profiles')
                    .select('business_name, name, phone, email, logo_url')
                    .eq('id', sale.user_id)
                    .single();
                if (profile) biz = profile;
            }

            renderInvoice(sale, biz);
        } catch (e) {
            showError();
        }
    }

    function renderInvoice(sale, biz) {
        const date = new Date(sale.created_at || Date.now());
        const dateStr = date.toLocaleDateString('en-NG', { day: 'numeric', month: 'long', year: 'numeric' });
        const hasBalance = sale.status === 'partial' || sale.status === 'pending';
        const bizName = biz.business_name || biz.name || 'My Business';

        // Item rows
        const items = Array.isArray(sale.items) ? sale.items : [];
        const itemRows = items.map(item => `
            <tr>
                <td class="item-name">${item.product?.name || item.name || '—'}</td>
                <td>${fmt(item.product?.price || item.price)}</td>
                <td>${item.quantity}</td>
                <td>${fmt((item.quantity) * (item.product?.price || item.price || 0))}</td>
            </tr>
        `).join('');

        document.getElementById('invoiceContent').innerHTML = `
            ${biz.logo_url ? `<img src="${biz.logo_url}" alt="${bizName}" style="max-height:60px;max-width:160px;object-fit:contain;margin-bottom:12px;display:block;">` : ''}
            <span class="inv-big-label">INVOICE</span>
            <div class="inv-biz-name-main">${bizName}</div>

            <div class="inv-info-card">
                <div class="inv-bill-col">
                    <div class="inv-card-label">Bill To</div>
                    <div class="inv-card-name">${sale.customer_name || '—'}</div>
                    ${sale.customer_phone && sale.customer_phone !== 'N/A' ? `<div class="inv-card-sub">${sale.customer_phone}</div>` : ''}
                </div>
                <div class="inv-meta-col">
                    <div class="inv-meta-item">
                        <div class="inv-card-label">Invoice No.</div>
                        <div class="inv-meta-val">${sale.order_number || sale.id}</div>
                    </div>
                    <div class="inv-meta-item">
                        <div class="inv-card-label">Issued</div>
                        <div class="inv-meta-val">${dateStr}</div>
                    </div>
                </div>
            </div>

            <table class="inv-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th style="text-align:right;">Price</th>
                        <th style="text-align:center;">Qty</th>
                        <th style="text-align:right;">Amount</th>
                    </tr>
                </thead>
                <tbody>${itemRows}</tbody>
            </table>

            <div class="inv-totals">
                <div class="inv-total-row"><span class="lbl">Subtotal</span><span class="val">${fmt(items.reduce((s, i) => s + (i.quantity * (i.product?.price || i.price || 0)), 0))}</span></div>
                ${sale.discount > 0 ? `<div class="inv-total-row"><span class="lbl">Discount</span><span class="val" style="color:#DC2626;">-${fmt(sale.discount)}</span></div>` : ''}
                ${sale.additional_charge > 0 ? `<div class="inv-total-row"><span class="lbl">Additional</span><span class="val">+${fmt(sale.additional_charge)}</span></div>` : ''}
                <div class="inv-total-row"><span class="lbl">Total</span><span class="val">${fmt(sale.amount)}</span></div>
            </div>

            <div class="inv-amount-due">
                <span class="lbl">Amount due</span>
                <span class="val">${fmt(hasBalance ? sale.balance : sale.amount)}</span>
            </div>

            ${hasBalance ? `
            <div class="inv-balance-box">
                <div class="inv-balance-row">
                    <span style="color:#92400E;font-weight:600;">Amount Paid</span>
                    <span style="color:#059669;font-weight:700;">${fmt(sale.amount_paid)}</span>
                </div>
                <div class="inv-balance-row">
                    <span style="color:#7F1D1D;font-weight:600;">Balance Due</span>
                    <span style="color:#DC2626;font-weight:700;">${fmt(sale.balance)}</span>
                </div>
            </div>` : ''}

            <div class="inv-payment-row">
                <span class="lbl">Payment</span>
                <span class="val">${fmtMethod(sale.payment_method)}</span>
            </div>

            <div class="inv-footer">
                <div class="inv-footer-thanks">Thank you for your business!</div>
                <div class="inv-footer-powered">Powered by Methang</div>
            </div>
        `;

        document.title = `Invoice ${sale.order_number || sale.id} – ${bizName}`;
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('invoicePage').style.display = 'block';
        if (sale.share_token) {
            _shareLink = `https://app.methang.com/invoice.html?token=${sale.share_token}`;
            document.getElementById('invActions').style.display = 'flex';
        }
    }

    function showError() {
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('errorScreen').style.display = 'flex';
    }

    let _shareLink = '';

    function showToast(msg) {
        const t = document.getElementById('invToast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    function copyInvoiceLink() {
        if (!_shareLink) return;
        navigator.clipboard.writeText(_shareLink).then(() => showToast('Link copied!')).catch(() => {
            prompt('Copy this link:', _shareLink);
        });
    }

    function shareWhatsApp() {
        if (!_shareLink) return;
        window.open('https://wa.me/?text=' + encodeURIComponent('Here is your invoice 🧾\n' + _shareLink), '_blank');
    }

    function shareNative() {
        if (!_shareLink) return;
        if (navigator.share) {
            navigator.share({ title: document.title, url: _shareLink });
        } else {
            copyInvoiceLink();
        }
    }

    loadInvoice();
</script>
</body>
</html>
