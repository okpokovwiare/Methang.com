<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalog — Methang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #F0F2F5; color: #1A1A1A; min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* Banner */
.banner { width: 100%; height: 180px; background: linear-gradient(135deg, #1A1A1A, #374151); overflow: hidden; }
.banner img { width: 100%; height: 100%; object-fit: cover; }

/* Store Header */
.store-header { padding: 0 20px; margin-top: -30px; position: relative; }
.store-logo { width: 60px; height: 60px; border-radius: 14px; background: white; border: 3px solid white; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #6B7280; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.store-logo img { width: 100%; height: 100%; object-fit: cover; }
.store-name { font-size: 22px; font-weight: 800; color: #1A1A1A; margin: 12px 0 4px; }
.store-desc { font-size: 14px; color: #6B7280; line-height: 1.6; margin-bottom: 8px; }
.store-contact { font-size: 13px; color: #9CA3AF; margin-bottom: 16px; }
.store-contact a { color: #0075FF; text-decoration: none; font-weight: 600; }

/* Product Count */
.product-count { font-size: 13px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.5px; padding: 16px 20px 10px; }

/* Product Grid */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px 40px; }
.card { background: white; border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform 0.15s; }
.card:active { transform: scale(0.98); }
.card-img { width: 100%; aspect-ratio: 1; background: #F3F4F6; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-img svg { width: 32px; height: 32px; stroke: #D1D5DB; stroke-width: 1.5; fill: none; }
.card-info { padding: 10px 12px 14px; }
.card-name { font-size: 14px; font-weight: 600; color: #1A1A1A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-price { font-size: 15px; font-weight: 700; color: #0075FF; margin-top: 2px; }

/* Loading */
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; }
.spinner { width: 32px; height: 32px; border: 3px solid #E5E7EB; border-top-color: #0075FF; border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Error / Not Found */
.error-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 32px; }
.error-icon { width: 80px; height: 80px; border-radius: 24px; background: #F3F4F6; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.error-icon svg { width: 36px; height: 36px; stroke: #9CA3AF; stroke-width: 1.5; fill: none; }
.error-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.error-desc { font-size: 14px; color: #6B7280; line-height: 1.5; }

/* Powered By */
.powered { text-align: center; padding: 20px; font-size: 12px; color: #9CA3AF; }
.powered a { color: #6B7280; text-decoration: none; font-weight: 600; }

/* Item Modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: none; }
.modal-backdrop.show { display: block; }
.modal-sheet { position: fixed; bottom: 0; left: 0; right: 0; z-index: 101; background: white; border-radius: 20px 20px 0 0; padding: 12px 20px 40px; max-height: 85vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s ease; }
.modal-sheet.show { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: #E5E7EB; border-radius: 2px; margin: 0 auto 16px; }
.modal-img { width: 100%; aspect-ratio: 1; border-radius: 16px; background: #F3F4F6; overflow: hidden; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; }
.modal-img img { width: 100%; height: 100%; object-fit: cover; }
.modal-img svg { width: 48px; height: 48px; stroke: #D1D5DB; stroke-width: 1; fill: none; }
.modal-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.modal-price { font-size: 22px; font-weight: 800; color: #0075FF; margin-bottom: 16px; }
.modal-contact-btn { width: 100%; padding: 16px; background: #0075FF; color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; }
.modal-contact-btn:active { background: #0056CC; }
</style>
</head>
<body>
<div id="app">
  <div class="loading">
    <div class="spinner"></div>
    <span style="font-size:14px;color:#6B7280">Loading catalog...</span>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ufcpvbabgtftyfumzpnp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmY3B2YmFiZ3RmdHlmdW16cG5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODEwMzcsImV4cCI6MjA5MDQ1NzAzN30.TzFJxnc8_ykXegNo2oMlN0xHXPkwHQcYNMAFMJorq5U';

const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };

async function query(table, params) {
  const url = `${SUPABASE_URL}/rest/v1/${table}?${params}`;
  const res = await fetch(url, { headers });
  if (!res.ok) throw new Error(`${res.status}`);
  return res.json();
}

function formatPrice(amount, symbol) {
  return symbol + Math.round(amount).toLocaleString('en');
}

function getInitials(name) {
  if (!name) return 'MB';
  const p = name.trim().split(' ');
  return p.length >= 2 ? (p[0][0] + p[p.length-1][0]).toUpperCase() : name.substring(0,2).toUpperCase();
}

async function loadCatalog() {
  const app = document.getElementById('app');

  // Get slug from URL path: /shop/my-store or /shop/?s=my-store
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  let slug = pathParts.length > 1 ? pathParts[pathParts.length - 1] : null;
  if (!slug) slug = new URLSearchParams(window.location.search).get('s');

  if (!slug) {
    app.innerHTML = renderError('No catalog specified', 'Please check the link and try again.');
    return;
  }

  try {
    // Fetch catalog
    const catalogs = await query('catalogs', `slug=eq.${encodeURIComponent(slug)}&published=eq.true&select=*`);
    if (!catalogs.length) {
      app.innerHTML = renderError('Catalog not found', 'This catalog may not exist or is not published yet.');
      return;
    }

    const catalog = catalogs[0];

    // Fetch profile
    const profiles = await query('profiles', `id=eq.${catalog.user_id}&select=business_name,logo_url,phone,email`);
    const profile = profiles[0] || {};

    // Fetch enabled items
    let items = [];
    if (catalog.enabled_item_ids && catalog.enabled_item_ids.length > 0) {
      const ids = catalog.enabled_item_ids.map(id => `"${id}"`).join(',');
      items = await query('items', `id=in.(${ids})&select=id,name,selling_price,image_url&order=name`);
    }

    // Update page title
    document.title = `${profile.business_name || 'Catalog'} — Methang`;

    // Render
    app.innerHTML = renderCatalog(catalog, profile, items);
    bindEvents(items, profile, catalog);

  } catch (err) {
    console.error(err);
    app.innerHTML = renderError('Something went wrong', 'Please try again later.');
  }
}

function renderError(title, desc) {
  return `
    <div class="error-page">
      <div class="error-icon">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </div>
      <div class="error-title">${title}</div>
      <div class="error-desc">${desc}</div>
    </div>`;
}

function renderCatalog(catalog, profile, items) {
  const sym = '$';

  const bannerHtml = catalog.banner_url
    ? `<div class="banner"><img src="${catalog.banner_url}" alt=""></div>`
    : `<div class="banner"></div>`;

  const logoHtml = profile.logo_url
    ? `<div class="store-logo"><img src="${profile.logo_url}" alt=""></div>`
    : `<div class="store-logo">${getInitials(profile.business_name)}</div>`;

  const descHtml = catalog.description
    ? `<div class="store-desc">${catalog.description}</div>`
    : '';

  const contactHtml = catalog.show_contact && (profile.phone || profile.email)
    ? `<div class="store-contact">${profile.phone ? profile.phone : ''}${profile.phone && profile.email ? ' &middot; ' : ''}${profile.email ? '<a href="mailto:' + profile.email + '">' + profile.email + '</a>' : ''}</div>`
    : '';

  const itemsHtml = items.map((item, i) => `
    <div class="card" data-idx="${i}">
      <div class="card-img">
        ${item.image_url
          ? `<img src="${item.image_url}" alt="${item.name}" loading="lazy">`
          : `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`
        }
      </div>
      <div class="card-info">
        <div class="card-name">${item.name}</div>
        <div class="card-price">${item.selling_price ? formatPrice(item.selling_price, sym) : 'Price on request'}</div>
      </div>
    </div>
  `).join('');

  return `
    ${bannerHtml}
    <div class="store-header">
      ${logoHtml}
      <div class="store-name">${profile.business_name || 'My Store'}</div>
      ${descHtml}
      ${contactHtml}
    </div>
    <div class="product-count">${items.length} Product${items.length !== 1 ? 's' : ''}</div>
    <div class="grid">${itemsHtml}</div>
    <div class="powered">Powered by <a href="https://methang.com" target="_blank">Methang</a></div>

    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-sheet" id="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-img" id="modal-img"></div>
      <div class="modal-name" id="modal-name"></div>
      <div class="modal-price" id="modal-price"></div>
      <button class="modal-contact-btn" id="modal-contact">Contact Seller</button>
    </div>
  `;
}

function bindEvents(items, profile, catalog) {
  const sym = '$';
  const backdrop = document.getElementById('modal-backdrop');
  const sheet = document.getElementById('modal-sheet');

  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = parseInt(card.dataset.idx);
      const item = items[idx];
      if (!item) return;

      document.getElementById('modal-img').innerHTML = item.image_url
        ? `<img src="${item.image_url}" alt="${item.name}">`
        : `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;
      document.getElementById('modal-name').textContent = item.name;
      document.getElementById('modal-price').textContent = item.selling_price ? formatPrice(item.selling_price, sym) : 'Price on request';

      const contactBtn = document.getElementById('modal-contact');
      if (profile.phone) {
        contactBtn.textContent = 'Contact Seller';
        contactBtn.onclick = () => window.open(`https://wa.me/${profile.phone.replace(/[^0-9]/g, '')}?text=Hi, I'm interested in "${item.name}" from your catalog.`, '_blank');
      } else if (profile.email) {
        contactBtn.textContent = 'Email Seller';
        contactBtn.onclick = () => window.location.href = `mailto:${profile.email}?subject=Inquiry about ${item.name}`;
      } else {
        contactBtn.style.display = 'none';
      }

      backdrop.classList.add('show');
      sheet.classList.add('show');
    });
  });

  backdrop.addEventListener('click', () => {
    backdrop.classList.remove('show');
    sheet.classList.remove('show');
  });
}

loadCatalog();
</script>
</body>
</html>
